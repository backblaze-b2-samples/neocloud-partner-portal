# CodeQL "advanced setup". Replaces GitHub's default setup so the scan can skip
# test scaffolding: every tests/server/*.test.js builds a bare express() app
# with cookie-parser and no CSRF middleware, which is correct for a test but
# trips js/missing-token-validation on every file.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config: |
            paths-ignore:
              - tests
              - dist
              - public
              - node_modules
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
