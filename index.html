<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Backblaze B2 for Neocloud — partner portal demo" />
    <title>Backblaze for Neocloud · Partner Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Runs before first paint so a light-mode user never sees a dark flash.
      // Deliberately duplicates a few lines of src/lib/theme.js: importing a
      // module here would defer past paint, which is the whole problem.
      // Dark is the stylesheet default, so it needs no attribute.
      (function () {
        try {
          var pref = localStorage.getItem('neocloud.theme') || 'system';
          var light = pref === 'light' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) { /* storage blocked — dark default stands */ }
      })();
    </script>
  </head>
  <body class="bg-ink-950 text-ink-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
